<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harmus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{ --mg:40px; --gut:20px; } /* margem e gutter do grid */
body{background:#fff;overflow:hidden;font-family:'Geist Mono',monospace;color:#555;}
canvas{display:block;}

/* canvas WebGL único (three.js) — desenha os anéis do grid e do player via viewport/scissor */
#gl{position:fixed;inset:0;z-index:4;pointer-events:none;}

/* ══ HOME / GRID ══ */
#home{position:fixed;inset:0;overflow-y:auto;background:#fff;z-index:3;}
#home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:44px var(--mg) 0;flex-wrap:wrap;}
.home-brand{display:flex;flex-direction:column;gap:14px;max-width:560px;}
.opus-hd{font-size:15px;color:#999;letter-spacing:8px;text-transform:uppercase;}
.home-brand p{font-size:12px;color:#777;line-height:1.7;}
.home-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pill{background:#e6e6e6;border:0;color:#555;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:9px 16px;border-radius:18px;cursor:pointer;}
.pill.dark{background:#111;color:#fff;}
#home-count{padding:28px var(--mg) 0;font-size:10px;letter-spacing:2px;color:#aaa;text-transform:uppercase;}
/* ── filtros: compositor + linha do tempo (época / anos) ── */
#grid-filters{padding:22px var(--mg) 0;display:flex;flex-direction:column;gap:16px;}
.f-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.f-lbl{font-size:10px;letter-spacing:2px;color:#aaa;text-transform:uppercase;width:96px;flex-shrink:0;padding-top:8px;}
.f-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.chip{background:#eee;border:0;color:#555;font-family:inherit;font-size:11px;letter-spacing:.5px;padding:7px 14px;border-radius:16px;cursor:pointer;transition:background .15s,color .15s;}
.chip:hover{background:#e0e0e0;}
.chip.on{background:#111;color:#fff;}
.chip .n{color:#aaa;margin-left:6px;}
.chip.on .n{color:#888;}
#timeline{flex:1;min-width:240px;max-width:760px;padding-top:12px;}
.tl-track{position:relative;height:10px;background:#ececec;border-radius:5px;touch-action:none;cursor:pointer;}
.tl-sel{position:absolute;top:0;bottom:0;background:#d2d2d2;border-radius:5px;}
.tl-dot{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:#111;transform:translate(-50%,-50%);pointer-events:none;}
.tl-dot.off{background:#bdbdbd;}
.tl-h{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#111;transform:translate(-50%,-50%);box-shadow:0 0 0 4px #fff;cursor:grab;touch-action:none;z-index:2;}
.tl-eras{position:relative;height:26px;margin-top:10px;}
.tl-era{position:absolute;top:0;height:100%;border:0;border-left:1px solid #ddd;background:none;font-family:inherit;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#999;cursor:pointer;text-align:left;padding:0 0 0 6px;white-space:nowrap;overflow:hidden;}
.tl-era:hover{color:#555;}
.tl-era.on{color:#111;}
.tl-meta{display:flex;align-items:center;gap:14px;padding-top:6px;}
#tl-range{font-size:11px;color:#555;white-space:nowrap;}
#f-clear{background:none;border:0;font-family:inherit;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#999;cursor:pointer;text-decoration:underline;padding:0;visibility:hidden;}
.grid-empty{grid-column:1/-1;font-size:12px;color:#999;padding:48px 0;text-align:center;}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:30px var(--gut);padding:16px var(--mg) 64px;}
.card{cursor:pointer;display:flex;flex-direction:column;gap:12px;}
.ring-view{position:relative;aspect-ratio:1/1;border-radius:18px;background:#f6f6f6;transition:background .25s;}
.card:hover .ring-view{background:#eeeeee;}
.card-status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:1px;color:#aaa;}
.card-title{font-size:15px;font-style:italic;color:#111;line-height:1.25;}
.card-composer{font-size:12px;color:#444;margin-top:4px;}
.card-info{font-size:10px;color:#999;margin-top:6px;letter-spacing:.5px;}
@media(max-width:600px){:root{--mg:16px;}}

#status{font-size:8px;color:#aaa;letter-spacing:2px;}

/* ══ PLAYER ══ */
#app{position:fixed;inset:0;display:none;z-index:5;}
.panel{position:absolute;overflow:hidden;background:#fff;}

#h-title{position:absolute;top:8%;left:2.08%;transform:translateY(-100%);font-size:30px;font-style:italic;font-weight:400;letter-spacing:0px;color:#111;z-index:8;max-width:44%;line-height:1.1;}
#h-author{position:absolute;top:8%;left:50.5%;transform:translateY(-100%);font-size:18px;font-weight:400;letter-spacing:0px;color:#333;z-index:8;}
#tag{position:absolute;bottom:2%;right:2.08%;font-size:12px;letter-spacing:2px;color:#999;z-index:8;}

#worknav{display:none !important;} /* navegação entre obras agora é pelo grid (⌂) */
#worknav-old{position:absolute;top:110px;left:2.08%;z-index:8;display:flex;align-items:center;gap:8px;height:44px;}
.navbtn{width:56px;height:44px;border-radius:22px;border:0;background:#e6e6e6;color:#555;font-family:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#worknum{width:56px;height:44px;border-radius:22px;background:#e6e6e6;display:flex;align-items:center;justify-content:center;font-size:16px;color:#333;}
#btn-newwork{width:32px;height:32px;border-radius:50%;border:0;background:#e6e6e6;color:#555;font-family:inherit;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:4px;flex-shrink:0;}
#btn-home{position:absolute;top:24px;right:2.08%;width:34px;height:34px;border-radius:50%;border:0;background:#e6e6e6;color:#555;font-family:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:9;}
#btn-info{position:absolute;top:66px;right:2.08%;width:34px;height:34px;border-radius:50%;border:0;background:#e6e6e6;color:#555;font-family:inherit;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:9;}

#color-bar{position:absolute;left:2.4%;top:20.5%;width:22px;height:58%;background:#e0e0e0;z-index:5;display:flex;flex-direction:column;border-radius:11px;overflow:hidden;}

/* anel central: só área de interação — o desenho vem do canvas #gl por baixo */
#p-ring{left:4%;top:10%;width:58%;height:83%;background:transparent;cursor:grab;touch-action:none;}
#p-ring:active{cursor:grabbing;}

#right-panel{position:absolute;left:62.6%;top:8%;width:35.3%;height:81.7%;background:transparent;z-index:1;}
#p-slice{left:65.6%;top:11%;width:32%;height:50.8%;z-index:2;background:transparent;}
#p-notes{left:65.6%;top:53%;width:32%;height:9%;z-index:2;background:transparent;}

#cam-modes{position:absolute;z-index:9;display:flex;flex-direction:column;align-items:flex-start;gap:10px;left:56.25%;top:11.5%;}
.toggle{background:#e0e0e0;border:0;color:#555;font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:8px 16px;cursor:pointer;outline:none;border-radius:18px;display:flex;align-items:center;gap:8px;white-space:nowrap;justify-content:center;width:120px;}
.toggle .led{width:8px;height:8px;border-radius:50%;background:#bbb;}
.toggle.on .led{background:#222;}

.cam-b{background:#e6e6e6;border:0;color:#666;font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px;cursor:pointer;outline:none;pointer-events:all;border-radius:17px;}
.cam-b[data-cam="persp"]{padding-left:10px;padding-right:18px;}
.cam-b.on{background:#333;color:#fff;}

#mixer-bar{position:absolute;left:64.5%;top:72%;width:30.5%;z-index:6;}

#scrub-wrap{position:absolute;left:26.3%;bottom:4.2%;width:47.4%;height:48px;background:#e6e6e6;display:flex;align-items:center;gap:14px;padding:0 20px;border-radius:24px;z-index:7;}
#btn-play{background:#111;border:0;color:#fff;font-family:inherit;font-size:13px;cursor:pointer;outline:none;line-height:1;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;flex-shrink:0;}
#scrub-knob{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#111;transform:translate(-50%,-50%);left:0%;pointer-events:none;box-shadow:0 0 0 5px rgba(255,255,255,0.9);}
#scrub{flex:1;height:12px;background:#d4d4d4;position:relative;cursor:pointer;border-radius:6px;touch-action:none;}
#scrub-fill{height:100%;background:#111;width:0%;border-radius:6px;}
#scrub-time{font-size:12px;color:#777;min-width:88px;text-align:right;}
</style>
</head>
<body>

<!-- ══ HOME: grid de anéis ══ -->
<div id="home">
  <div id="home-head">
    <div class="home-brand">
      <div class="opus-hd">HARMUS</div>
      <p>Visualização de obras sinfônicas. Cada nota vira cor, forma e posição — e cada anel é uma obra inteira, do início ao fim. Escolha uma para entrar.</p>
    </div>
    <div class="home-actions">
      <button class="pill" id="btn-info-home">(i) catálogo de formas</button>
      <button class="pill dark" id="btn-upload-home">+ carregar obra</button>
    </div>
  </div>
  <div id="home-count"></div>
  <div id="grid-filters">
    <div class="f-row"><span class="f-lbl">compositor</span><div class="f-chips" id="f-composers"></div></div>
    <div class="f-row"><span class="f-lbl">época</span>
      <div id="timeline">
        <div class="tl-track" id="tl-track"><div class="tl-sel" id="tl-sel"></div><div class="tl-h" data-h="0"></div><div class="tl-h" data-h="1"></div></div>
        <div class="tl-eras" id="tl-eras"></div>
        <div class="tl-meta"><span id="tl-range"></span><button id="f-clear">limpar filtros</button></div>
      </div>
    </div>
  </div>
  <div id="grid"></div>
  <input type="file" id="file-input" accept=".xml,.musicxml,.mxl" style="display:none;">
</div>

<div id="formas-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;">
  <div style="position:relative;width:56vw;height:72vh;min-width:340px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,0.25);">
    <button id="formas-close" style="position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:#e6e6e6;border:0;color:#555;font-family:inherit;font-size:14px;cursor:pointer;z-index:2;">×</button>
    <iframe id="formas-frame" src="" style="width:100%;height:100%;border:0;"></iframe>
  </div>
</div>

<div id="status" style="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:10px;letter-spacing:1px;color:#999;z-index:50;pointer-events:none;"></div>

<!-- ══ PLAYER ══ -->
<div id="app">
  <button id="btn-home" title="voltar às obras">⌂</button>
  <button id="btn-info" title="catálogo de formas">(i)</button>
  <span id="h-title">—</span>
  <span id="h-author">—</span>
  <span id="tag">2.0 · HARMUS</span>

  <div id="worknav">
    <button id="nav-prev" class="navbtn">←</button>
    <div id="worknum">1 / 1</div>
    <button id="nav-next" class="navbtn">→</button>
    <input type="file" id="file-input-2" accept=".xml,.musicxml,.mxl" style="display:none;">
    <button id="btn-newwork" title="carregar seu arquivo .musicxml / .mxl">+</button>
  </div>

  <div id="color-bar"></div>

  <div class="panel" id="p-ring"></div>

  <div id="cam-modes" style="top:250px;left:calc(58% - 90px);">
    <button class="toggle" data-cam="follow"><span class="led"></span>seguir</button>
    <button class="toggle" id="btn-onlyactive"><span class="led"></span>soando</button>
  </div>

  <div id="right-panel"></div>
  <div class="panel" id="p-slice"></div>
  <div class="panel" id="p-notes"></div>

  <div id="cam-cross" style="position:absolute;left:calc(var(--mg) + 24px);bottom:64px;z-index:8;display:grid;grid-template-columns:56px 70px 56px;grid-template-rows:repeat(3,30px);gap:5px;">
    <span></span><button class="cam-b" data-cam="top">TOPO</button><span></span>
    <button class="cam-b" data-cam="side">ESQ</button><button class="cam-b" data-cam="persp">CENTRO</button><button class="cam-b" data-cam="right">DIR</button>
    <span></span><button class="cam-b" data-cam="front">BASE</button><span></span>
  </div>

  <div id="mixer-bar"><div id="mixer" style="display:flex;flex-direction:column;gap:8px;width:100%;"></div></div>

  <div id="scrub-wrap">
    <button id="btn-play">▶</button>
    <div id="scrub"><div id="scrub-fill"></div><div id="scrub-knob"></div></div>
    <div id="scrub-time">0:00 / 0:00</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ══════════════════════════════════════════════════════════════
//  REPOSITÓRIO — as obras vêm da pasta /obras do GitHub
//  1) se existir obras/obras.json, ele manda (ordem, títulos, metadados p/ filtro)
//  2) senão lista a pasta pela API do GitHub
//  3) senão usa a lista fixa abaixo
// ══════════════════════════════════════════════════════════════
const REPO={owner:'brnrcintra-eng',repo:'Harmus',branch:'main',dir:'obras'};
const RAW=`https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${REPO.branch}/${REPO.dir}/`;
// year = ano de composição (usado no filtro de época). obras.json pode sobrescrever tudo isso.
const KNOWN={
  'arabesque-no-1-claude-debussy-orchestration.mxl':{title:'Arabesco No. 1',composer:'Debussy',year:1888},
  'beethoven-symphony-no-5-op67-mvt-1.mxl':{title:'Sinfonia No. 5, Op. 67 (1º mov.)',composer:'Beethoven',year:1808},
  'bolero-maurice-ravel.mxl':{title:'Boléro',composer:'Ravel',year:1928},
  'requiem-totenmesse-giuseppi-verdi.mxl':{title:'Requiem (Totenmesse)',composer:'Verdi',year:1874},
  'symphony-no-9-finale-ode-to-joy-symphony-spectacular-collosus-800-followers.mxl':{title:'Sinfonia No. 9, Final "Ode à Alegria"',composer:'Beethoven',year:1824},
  'waltz-no-2-schwartz.mxl':{title:'Valsa No. 2',composer:'Shostakovich',year:1956},
};
// linha do tempo do filtro
const YMIN=1600, YMAX=2026;
const ERAS=[
  {label:'Barroco',a:1600,b:1750},
  {label:'Clássico',a:1750,b:1820},
  {label:'Romântico',a:1820,b:1900},
  {label:'Moderno',a:1900,b:2026},
];
const eraOf=y=>y?(ERAS.find(e=>y>=e.a&&y<e.b)||ERAS[ERAS.length-1]).label:'';

// ── Cores ────────────────────────────────────────────────────
const STEP_HUE={C:0,D:51,E:103,F:154,G:206,A:257,B:309};
const STEP_SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function alterHueShift(h,a){if(a<=-1)return h*0.80;if(a===1)return h*1.10;if(a>=2)return h*1.20;return h;}
function octaveBright(o){return Math.max(0.20,Math.min(1.0,0.20+o*0.10));}
const DYN_SAT={ppp:0.15,pp:0.25,p:0.40,mp:0.55,mf:0.70,f:0.82,ff:0.92,fff:1.00};
const DYN_ATTACK={sf:0.90,fz:0.95,sfz:1.00,fp:1.00}, DYN_AFTER={sf:0.70,fz:0.70,sfz:0.70,fp:0.40};
function hsbToRgb(h,s,b){h=((h%360)+360)%360;const c=b*s,x=c*(1-Math.abs((h/60)%2-1)),m=b-c;let r=0,g=0,bl=0;if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;bl=x;}else if(h<240){g=x;bl=c;}else if(h<300){r=x;bl=c;}else{r=c;bl=x;}return[(r+m)*255,(g+m)*255,(bl+m)*255];}
const NOTE_NAMES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
function noteName(m){return NOTE_NAMES[m%12]+(Math.floor(m/12)-1);}
function fmtTime(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}

// ── PAN por instrumento ──────────────────────────────────────
const PAN_TABLE=[
  [/harp|harpa|arpa/i,-48],
  [/flaut|flute|piccolo|ottavino/i,-28],
  [/corno|horn/i,-22],
  [/violini i|violin i|1st violin|primeiro/i,-12],
  [/viole|viola/i,-6],
  [/oboi|oboe|corno inglese|english horn/i,6],
  [/violini ii|violin ii|2nd violin|segundo/i,12],
  [/clarinet/i,18],
  [/celli|cello|violonc/i,24],
  [/fagott|bassoon/i,30],
  [/tromb[ae]|trumpet|pist/i,36],
  [/bassi|contrab|double bass|c\. bassi/i,42],
  [/timpani/i,46],
  [/trombone/i,50],
  [/tuba/i,54],
  [/drum|tambour|tamburo|triangolo|piatti|cassa|cloches|cann?on|perc/i,58],
];
function panFor(name,rawPan){
  if(rawPan!=null && Math.abs(rawPan)>5) return Math.max(-100,Math.min(100,rawPan));
  for(const[rx,v]of PAN_TABLE)if(rx.test(name))return v;
  return 0;
}
const NAIPE_RX={
  cordas:/violin|viola|cello|bass|string|archi|violini|viole|celli|bassi|contrab/i,
  madeiras:/flute|flauto|oboe|oboi|clarinet|clarinetto|bassoon|fagotto|piccolo|corno inglese|english horn/i,
  metais:/horn|corno|trumpet|tromba|trombe|trombone|tuba|pist/i,
  'percussão':/timpani|drum|tambour|tamburo|triangolo|piatti|cassa|cloches|cann?on|perc|cymbal|snare/i,
  piano:/piano|klavier|keyboard/i,
  harpa:/harp|arpa/i,
};
function detectNaipe(n){for(const[k,rx]of Object.entries(NAIPE_RX))if(rx.test(n||''))return k;return 'outros';}
const ORDEM=['cordas','madeiras','metais','percussão','piano','harpa','outros'];

// ── Formas das articulações (polígonos normalizados, y+ = cima) ──
// 0 normal · 1 staccatissimo · 2 staccato · 3 tenuto · 4 acento · 5 marcato · 6 sforzando · 7 portato
function artPolygon(art, side){
  let pts;
  switch(art){
    case 1: pts=[[-0.5,0.5],[-0.5,-0.5],[0.5,-0.5]]; break;
    case 2: pts=[[-0.5,-0.5],[-0.5,0.5],[0.1,0.5],[0.5,-0.5]]; break;
    case 3: pts=[[-0.5,-0.5],[-0.28,0.5],[0.28,0.5],[0.5,-0.5]]; break;
    case 4: pts=[[-0.5,-0.5],[-0.5,0.15],[0.5,0.5],[0.5,-0.5]]; break;
    case 5: pts=[[-0.5,-0.15],[0.5,0.5],[0.5,-0.5]]; break;
    case 6: pts=[[-0.5,-0.5],[-0.28,-0.5],[0.5,0.5],[0.28,0.5]]; break;
    case 7: pts=[[-0.5,-0.5],[-0.5,0.5],[-0.15,0.5],[0,0.28],[0.15,0.5],[0.5,0.5],[0.5,-0.5]]; break;
    default: pts=[[-0.5,0.5],[0.5,0.5],[0.5,-0.5],[-0.5,-0.5]];
  }
  return clipHalf(pts, side);
}
function clipHalf(pts, side){
  if(side==='full'||!side) return pts;
  const keepLeft=(side==='left'), out=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const aIn=keepLeft?a[0]<=0:a[0]>=0, bIn=keepLeft?b[0]<=0:b[0]>=0;
    if(aIn)out.push(a);
    if(aIn!==bIn){const t=(0-a[0])/(b[0]-a[0]);out.push([0, a[1]+(b[1]-a[1])*t]);}
  }
  return out;
}
const rectPts=(cx,cy,w,h)=>[[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2]];
const flipY=(pts,f)=>f<0?pts.map(([x,y])=>[x,-y]):pts;
function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const[x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];a+=x1*y2-x2*y1;}return Math.abs(a/2);}

// ── FORMA ÚNICA DA NOTA ──────────────────────────────────────
// Fonte de verdade das formas: lista de polígonos 2D (com multiplicador de alfa).
// O painel 2D desenha esses polígonos; o anel 3D extruda os mesmos polígonos.
function shapeOf(n){
  if(n._shape) return n._shape;
  const flip=(n.stemDown||n.alter)?-1:1;
  let key, parts;
  if(n.mute){ key='mute'; parts=[{pts:[[0,.51],[.51,0],[0,-.51],[-.51,0]], mute3d:true}]; }
  else if(n.harmonic){ key='harm'; parts=[{pts:[[-.5,.5],[.5,.5],[.5,0],[-.5,.18]]}]; }
  else if(n.gliss){ const d=n.glissDown?-1:1; key='gl'+d; parts=[{pts:[[-.5,-.5*d],[-.28,-.5*d],[.5,.5*d]]}]; }
  else if(n.tech==='pizz'){ key='pz'+flip; parts=[{pts:flipY([[0,.5],[.5,-.5],[-.5,-.5]],flip)}]; }
  else if(n.hasTremolo){
    const div=Math.max(2,Math.min(4,(n.tremoloMarks||3)+1)), c=1/div; key='tr'+div; parts=[];
    for(let ix=0;ix<div;ix++)for(let iy=0;iy<div;iy++) if((ix+iy)%2===0) parts.push({pts:rectPts(-.5+(ix+.5)*c, .5-(iy+.5)*c, c*.88, c*.88)});
  }
  else if(n.hasTrill){ key='tl'; parts=[0,1,2,3].map(k=>({pts:rectPts(-.5+(k+.5)*.25, k%2?-.2:.2, .2, .5)})); }
  else if(n.hasTurn||n.hasMordent){
    const pat=n.hasTurn?[0,1,0,-1]:[0,n.mordentDir||-1,0], nf=pat.length;
    key='tn'+pat.join('')+flip;
    parts=pat.map((v,k)=>({pts:rectPts(-.5+(k+.5)/nf, v*.3*flip, .9/nf, 1)}));
  }
  else if(n.pedal){ key='pd'; parts=[{pts:rectPts(0,.25,1,.5)},{pts:rectPts(0,-.25,1,.5),mul:.85}]; }
  else if(n.arpeggio){ key='ar'; parts=[{pts:[[-.5,.5],[-1/6,.5],[0,-.15],[1/6,.5],[.5,.5],[.5,-.5],[-.5,-.5]]}]; }
  else if(n.art1||n.art2){
    const a1=n.art1||n.art2, a2=n.art2||n.art1; key='at'+a1+'_'+a2+'_'+flip;
    if((a1===2&&a2===4)||(a1===4&&a2===2)) parts=[{pts:flipY([[-.5,.5],[-.5,-.5],[.5,-.5],[.5,.5],[0,.05]],flip)}]; // staccato+acento → entalhe em V
    else if(a1===a2) parts=[{pts:flipY(artPolygon(a1,'full'),flip)}];
    else parts=[{pts:flipY(artPolygon(a1,'left'),flip)},{pts:flipY(artPolygon(a2,'right'),flip)}];
  }
  else { key='sq'; parts=[{pts:rectPts(0,0,1,1)}]; }
  if(n.hasFermata){ key+='F'; parts=parts.concat([{pts:rectPts(.8,0,.5,1),mul:.55}]); }
  parts=parts.filter(p=>p.mute3d||(p.pts.length>=3&&polyArea(p.pts)>1e-4));
  return n._shape={key,parts};
}

// ── PARSER ───────────────────────────────────────────────────
function fundeTies(notes){
  for(let i=0;i<notes.length;i++){
    const n=notes[i];
    if(!n.tieStart||n._consumed)continue;
    let total=n.durMs, totalB=n.beats, j=i+1, guard=0;
    while(j<notes.length && guard++<500){
      const m=notes[j];
      if(m.part===n.part && m.midi===n.midi && (m.tieStop||m.tieStart)){
        total+=m.durMs; totalB+=m.beats; m._consumed=true;
        if(m.tieStop && !m.tieStart) break;
      }
      j++;
    }
    n.durMs=total; n.beats=totalB;
  }
  for(let i=notes.length-1;i>=0;i--) if(notes[i]._consumed) notes.splice(i,1);
}

function parseMusicXML(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('XML inválido');
  const title=doc.querySelector('work work-title')?.textContent || doc.querySelector('movement-title')?.textContent || '';
  let composer='';
  doc.querySelectorAll('identification creator').forEach(c=>{ if(c.getAttribute('type')==='composer' && !composer) composer=c.textContent; });
  const partNames={},partPan={};
  doc.querySelectorAll('part-list score-part').forEach(sp=>{
    const id=sp.getAttribute('id');
    const nm=sp.querySelector('part-name');partNames[id]=nm?nm.textContent.trim():id;
    const pe=sp.querySelector('midi-instrument pan');partPan[id]=pe?parseFloat(pe.textContent):null;
  });
  const notes=[];let maxMs=0;
  doc.querySelectorAll('part').forEach(part=>{
    const pid=part.getAttribute('id'),pname=partNames[pid]||pid,naipe=detectNaipe(pname);
    let divisions=1,tempo=120,curSat=0.70,transpose=0,cursor=0,lastStart=0;
    let curWedge=null, curTech=null, curPedal=false, curAgogica=null, pendAgogica=null, curMute=false, sfzAt=null;
    part.querySelectorAll('measure').forEach(measure=>{
      measure.querySelectorAll('attributes').forEach(at=>{
        const d=at.querySelector('divisions');if(d)divisions=parseInt(d.textContent)||divisions;
        const tr=at.querySelector('transpose chromatic');if(tr)transpose=parseInt(tr.textContent)||0;
      });
      for(const el of measure.children){
        const tag=el.tagName;
        if(tag==='direction'){
          const dyn=el.querySelector('dynamics');
          if(dyn&&dyn.children.length){
            const d=dyn.children[0].tagName.toLowerCase();
            if(DYN_SAT[d]!=null)curSat=DYN_SAT[d];
            else if(DYN_ATTACK[d]!=null){curSat=DYN_AFTER[d]; sfzAt=cursor;} // sf/sfz/fz/fp: ataque forte na próxima nota
          }
          const wedge=el.querySelector('wedge');
          if(wedge){const wt=wedge.getAttribute('type');
            if(wt==='crescendo')curWedge='cresc'; else if(wt==='diminuendo')curWedge='dim'; else if(wt==='stop')curWedge=null;}
          const words=el.querySelector('words');
          if(words&&words.textContent){const w=words.textContent.trim().toLowerCase();
            if(/pizz/.test(w))curTech='pizz'; else if(/arco/.test(w))curTech=null;
            if(/con sord|sordin|surdina|\bmute\b/.test(w))curMute=true;
            else if(/senza sord|via sord|open|sem surdina/.test(w))curMute=false;
            if(/cresc/.test(w))curWedge='cresc'; else if(/dim|decresc/.test(w))curWedge='dim';
            if(/accel/.test(w))pendAgogica='accel'; else if(/ritard|rallent|rall\.|riten/.test(w))pendAgogica='rit';
          }
          const dsh=el.querySelector('dashes');
          if(dsh){const dt=dsh.getAttribute('type');
            if(dt==='start'&&pendAgogica){curAgogica=pendAgogica;pendAgogica=null;} else if(dt==='stop')curAgogica=null;}
          const ped=el.querySelector('pedal');
          if(ped){const pt=ped.getAttribute('type');if(pt==='start')curPedal=true;else if(pt==='stop')curPedal=false;}
          const s=el.querySelector('sound[tempo]');if(s)tempo=parseFloat(s.getAttribute('tempo'))||tempo;continue;
        }
        if(tag==='sound'){if(el.hasAttribute('tempo'))tempo=parseFloat(el.getAttribute('tempo'))||tempo;continue;}
        if(tag==='backup'){const d=el.querySelector('duration');cursor-=((d?parseInt(d.textContent):0)/divisions)*(60000/tempo);if(cursor<0)cursor=0;continue;}
        if(tag==='forward'){const d=el.querySelector('duration');cursor+=((d?parseInt(d.textContent):0)/divisions)*(60000/tempo);continue;}
        if(tag!=='note')continue;
        if(el.querySelector('cue')){
          if(!el.querySelector('chord')){const cd=el.querySelector('duration');cursor+=((cd?parseInt(cd.textContent):0)/divisions)*(60000/tempo);}
          continue;
        }
        const isChord=!!el.querySelector('chord'),isRest=!!el.querySelector('rest');
        const isGrace=!!el.querySelector('grace');
        const unpitched=el.querySelector('unpitched');
        const dEl=el.querySelector('duration'),ticks=dEl?parseInt(dEl.textContent):0;
        const durMs=(ticks/divisions)*(60000/tempo),beats=ticks/divisions;
        const voice=el.querySelector('voice')?el.querySelector('voice').textContent:'1';
        const startMs=isChord?lastStart:cursor;
        const stemEl=el.querySelector('stem');
        const stemDown=stemEl?stemEl.textContent==='down':false;
        const hasFermata=!!el.querySelector('notations fermata');
        let tieStart=false,tieStop=false;
        el.querySelectorAll('tie').forEach(t=>{const ty=t.getAttribute('type');if(ty==='start')tieStart=true;if(ty==='stop')tieStop=true;});

        if(!isRest){
          let midi, realOct, color, alter=0;
          if(unpitched){ midi=60; realOct=4; color=hsbToRgb(0,0,0.55); }
          else {
            const st=el.querySelector('pitch step')?.textContent||'C';
            const oc=parseInt(el.querySelector('pitch octave')?.textContent||'4');
            alter=parseInt(el.querySelector('pitch alter')?.textContent||'0')||0;
            midi=(oc+1)*12+STEP_SEMI[st]+alter+transpose;
            realOct=Math.floor(midi/12)-1;
            color=hsbToRgb(alterHueShift(STEP_HUE[st],alter),curSat,octaveBright(realOct));
          }
          const arts=[];
          el.querySelectorAll('notations articulations > *').forEach(a=>{
            const t=a.tagName.toLowerCase();
            if(t==='staccatissimo')arts.push(1);else if(t==='staccato')arts.push(2);
            else if(t==='tenuto')arts.push(3);else if(t==='accent')arts.push(4);
            else if(t==='strong-accent')arts.push(5);else if(t==='detached-legato')arts.push(7);
          });
          const tremEl=el.querySelector('notations ornaments tremolo');
          const mordEl=el.querySelector('notations ornaments inverted-mordent, notations ornaments mordent');
          let glissStart=false;
          el.querySelectorAll('notations glissando, notations slide').forEach(g=>{const ty=g.getAttribute('type');if(ty!=='stop')glissStart=true;});
          notes.push({midi,startMs,durMs,beats,voice,isChord,naipe,part:pname,pan:partPan[pid],color,
            art1:arts[0]||0, art2:arts[1]||arts[0]||0,
            stemDown, isGrace, hasFermata, tieStart, tieStop, unpitched:!!unpitched, alter:(unpitched?0:alter),
            satVal:curSat, wedge:curWedge, tech:curTech,
            hasTremolo:!!tremEl, tremoloMarks:parseInt(tremEl?.textContent)||3,
            hasTrill:!!el.querySelector('notations ornaments trill-mark'),
            hasTurn:!!el.querySelector('notations ornaments turn, notations ornaments delayed-turn'),
            hasMordent:!!mordEl, mordentDir: mordEl ? (mordEl.tagName==='inverted-mordent'?1:-1) : 0,
            pedal:curPedal, arpeggio:!!el.querySelector('notations arpeggiate'), gliss:glissStart, agogica:curAgogica,
            harmonic:!!el.querySelector('notations technical harmonic'), mute:curMute,
            sfz: sfzAt!=null && Math.abs(startMs-sfzAt)<1});
        }
        if(!isChord&&!isGrace){lastStart=startMs;cursor=startMs+durMs;}
        if(startMs+durMs>maxMs)maxMs=startMs+durMs;
      }
    });
  });
  fundeTies(notes);
  notes.sort((a,b)=>a.startMs-b.startMs);
  marcaWedges(notes);
  aplicaAgogica(notes);
  notes.sort((a,b)=>a.startMs-b.startMs);
  posProcessa(notes);
  return{notes,totalMs:maxMs,title,composer};
}

// agógica gradual: reespaça as notas dentro da região de accel/rit
function aplicaAgogica(notes){
  const byPart={};
  for(const n of notes)(byPart[n.part]=byPart[n.part]||[]).push(n);
  for(const arr of Object.values(byPart)){
    arr.sort((a,b)=>a.startMs-b.startMs);
    let i=0;
    while(i<arr.length){
      const g=arr[i].agogica; if(!g){i++;continue;}
      let j=i; while(j<arr.length && arr[j].agogica===g) j++;
      if(j-i>=2){
        const t0=arr[i].startMs, span=arr[j-1].startMs-t0;
        if(span>0) for(let k=i;k<j;k++){
          const p=(arr[k].startMs-t0)/span;
          arr[k].startMs = t0 + (g==='accel' ? 1-(1-p)*(1-p) : p*p)*span;
        }
      }
      i=j;
    }
  }
}
// posição (0→1) de cada nota dentro do seu crescendo/diminuendo
function marcaWedges(notes){
  const byPart={};
  for(const n of notes)(byPart[n.part]=byPart[n.part]||[]).push(n);
  for(const arr of Object.values(byPart)){
    arr.sort((a,b)=>a.startMs-b.startMs);
    let i=0;
    while(i<arr.length){
      const w=arr[i].wedge; if(!w){i++;continue;}
      let j=i; while(j<arr.length && arr[j].wedge===w) j++;
      const len=j-i;
      for(let k=i;k<j;k++) arr[k].wedgePos = len>1 ? (k-i)/(len-1) : 1;
      i=j;
    }
  }
}
// alvo do glissando (próxima nota da parte) e ordem do arpejo (grave → agudo)
function posProcessa(notes){
  const byPart={};
  for(const n of notes)(byPart[n.part]=byPart[n.part]||[]).push(n);
  for(const arr of Object.values(byPart)){
    for(let i=0;i<arr.length;i++){
      const n=arr[i]; if(!n.gliss)continue;
      let j=i+1; while(j<arr.length && arr[j].startMs<=n.startMs+1) j++;
      if(j<arr.length){ n.glissTarget=arr[j].midi; n.glissDown=arr[j].midi<n.midi; }
    }
    const grp={};
    for(const n of arr) if(n.arpeggio){const k=Math.round(n.startMs);(grp[k]=grp[k]||[]).push(n);}
    for(const g of Object.values(grp)){ g.sort((a,b)=>a.midi-b.midi); g.forEach((n,i)=>n.arpIdx=i); }
  }
}

//  THREE.JS — anel 3D com InstancedMesh (uma malha por tipo de forma)
//  Ângulo = tempo · raio = instrumento (pan) · Y = altura
//  Opacidade, "soando", naipes e melodia/harmonia são calculados na GPU.
// ══════════════════════════════════════════════════════════════
const R0=100, RW=R0/3, PITCH_H=R0*1.31, NOTE_SZ=1.6;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0xffffff,0);
renderer.autoClear=false;
renderer.domElement.id='gl';
document.body.appendChild(renderer.domElement);

const VS=`
attribute vec3 aCol; attribute vec4 aInfo; attribute float aMul;
uniform float uTime, uOnly, uMel, uHarm; uniform float uNaipe[7];
varying vec3 vCol; varying float vA;
void main(){
  float nop=uNaipe[int(aInfo.z+0.5)];
  float vop=aInfo.w>0.5?uMel:uHarm;
  float act=(uTime>=aInfo.x && uTime<aInfo.x+aInfo.y)?1.0:0.0;
  float a=mix(0.82,1.0,act)*nop*vop*aMul;
  if(uOnly>0.5) a*=act;
  mat4 mi=modelMatrix*instanceMatrix;
  vec3 nrm=normalize(mat3(viewMatrix*mi)*normal);
  float sh=0.84+0.16*max(dot(nrm,normalize(vec3(0.35,0.75,0.55))),0.0);
  vCol=aCol*sh; vA=a;
  gl_Position=projectionMatrix*viewMatrix*mi*vec4(position,1.0);
  if(a<0.002) gl_Position=vec4(2.0,2.0,2.0,1.0);
}`;
const FS=`
varying vec3 vCol; varying float vA;
void main(){ if(vA<0.002) discard; gl_FragColor=vec4(vCol,vA); }`;

const geoCache=new Map();
function geometryFor(s){
  let g=geoCache.get(s.key); if(g) return g;
  const list=[];
  for(const p of s.parts){
    let geo;
    if(p.mute3d){ geo=new THREE.BoxGeometry(1,.72,.72).toNonIndexed(); geo.rotateX(Math.PI/4); } // surdina: prisma girado 45°
    else{
      const sh=new THREE.Shape(p.pts.map(([x,y])=>new THREE.Vector2(x,y)));
      geo=new THREE.ExtrudeGeometry(sh,{depth:1,bevelEnabled:false,steps:1,curveSegments:1});
      geo.translate(0,0,-.5);
    }
    geo.deleteAttribute('uv'); geo.clearGroups();
    const cnt=geo.attributes.position.count;
    geo.setAttribute('aMul',new THREE.BufferAttribute(new Float32Array(cnt).fill(p.mul??1),1));
    list.push(geo);
  }
  g=list.length===1?list[0]:mergeGeometries(list,false);
  geoCache.set(s.key,g);
  return g;
}

function buildRing(w){
  const scene=new THREE.Scene();
  const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:-1},uOnly:{value:0},uMel:{value:1},uHarm:{value:1},uNaipe:{value:new Array(7).fill(1)}},
    vertexShader:VS, fragmentShader:FS, transparent:true, side:THREE.DoubleSide,
  });
  const groups=new Map();
  for(const n of w.notes){
    const s=shapeOf(n); let g=groups.get(s.key);
    if(!g){g={shape:s,list:[]};groups.set(s.key,g);}
    g.list.push(n);
  }
  const T=w.totalMs||1, pRange=Math.max(1,w.pMax-w.pMin);
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), pos=new THREE.Vector3(), scl=new THREE.Vector3(), yAx=new THREE.Vector3(0,1,0);
  for(const g of groups.values()){
    const geom=geometryFor(g.shape).clone(), cnt=g.list.length;
    const mesh=new THREE.InstancedMesh(geom,mat,cnt);
    const aCol=new Float32Array(cnt*3), aInfo=new Float32Array(cnt*4);
    g.list.forEach((n,i)=>{
      const angMid=((n.startMs+n.durMs/2)/T)*Math.PI*2-Math.PI/2;
      const rad=R0+n.xNorm*RW;
      pos.set(Math.sin(angMid)*rad, ((n.midi-w.pMin)/pRange-0.5)*PITCH_H, Math.cos(angMid)*rad);
      const arcLen=Math.max(NOTE_SZ*0.4,(n.durMs/T)*Math.PI*2*rad);
      let h=NOTE_SZ, esp=NOTE_SZ*0.7;
      if(n.isGrace){h=NOTE_SZ*0.5;esp=NOTE_SZ*0.5;}
      if(n.wedge==='cresc'&&n.wedgePos!=null)h*=1+n.wedgePos*0.6;
      else if(n.wedge==='dim'&&n.wedgePos!=null)h*=1-n.wedgePos*0.6;
      q.setFromAxisAngle(yAx,angMid); // X local = tangente (tempo), Z local = radial
      scl.set(arcLen,h,esp);
      mesh.setMatrixAt(i,m4.compose(pos,q,scl));
      aCol[i*3]=n.color[0]/255; aCol[i*3+1]=n.color[1]/255; aCol[i*3+2]=n.color[2]/255;
      aInfo[i*4]=n.startMs; aInfo[i*4+1]=n.durMs; aInfo[i*4+2]=ORDEM.indexOf(n.naipe); aInfo[i*4+3]=n.voice==='1'?1:0;
    });
    geom.setAttribute('aCol',new THREE.InstancedBufferAttribute(aCol,3));
    geom.setAttribute('aInfo',new THREE.InstancedBufferAttribute(aInfo,4));
    mesh.frustumCulled=false;
    scene.add(mesh);
  }
  // linha do playhead
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
  const line=new THREE.Line(lg,new THREE.LineBasicMaterial({color:0x6e6e6e,transparent:true,opacity:0.6}));
  line.frustumCulled=false; line.visible=false; scene.add(line);
  w.scene=scene; w.mat=mat; w.line=line;
}

// câmera orbital equivalente a girar o anel por rotX/rotA e olhar de +Z
const _e=new THREE.Euler(), _m=new THREE.Matrix4();
function orbitPose(rx,ra,dist,outPos,outUp){
  _m.makeRotationFromEuler(_e.set(rx,ra,0,'XYZ')).invert();
  outPos.set(0,0,dist).applyMatrix4(_m);
  outUp.set(0,1,0).applyMatrix4(_m).normalize();
}
// capas: distância que garante o anel inteiro no quadrado em qualquer inclinação (esfera envolvente)
const MAX_TILT=1.35, RING_RS=Math.hypot(R0+RW+NOTE_SZ,PITCH_H/2+NOTE_SZ)*1.04;
const _qSpin=new THREE.Quaternion(), _qTilt=new THREE.Quaternion(), _eT=new THREE.Euler(), _yAx=new THREE.Vector3(0,1,0);
function fitSphere(aspect,fov){
  let half=THREE.MathUtils.degToRad(fov)/2;
  if(aspect<1)half=Math.atan(Math.tan(half)*aspect);
  return RING_RS/Math.sin(half);
}
function fitDist(span,aspect,fov){let d=(span/2)/Math.tan(THREE.MathUtils.degToRad(fov)/2);if(aspect<1)d/=aspect;return d;}

function noteOpacity(n){ return (naipeOp[n.naipe]??1)*((n.voice==='1')?(melOn?1:0):(harmOn?1:0)); }
function computeActive(){
  const t=playheadMs,o=[];
  for(const n of cur.notes){ if(n.startMs>t)break; if(n.startMs+n.durMs>t&&noteOpacity(n)>0)o.push(n); }
  activeNow=o;
}

const prettyName=f=>f.replace(/\.(mxl|musicxml|xml)$/i,'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function makeWork(o){
  const k=KNOWN[o.file]||{};
  const w=Object.assign({status:'idle',hover:false,spin:Math.random()*Math.PI*2,tilt:{x:0,y:0,tx:0,ty:0}},o);

  return w;
}

// A PASTA manda (todo .mxl/.musicxml/.xml que estiver em obras/ aparece).
// obras.json é opcional e só COMPLEMENTA: título, compositor, ano e ordem.
async function discoverWorks(){
  let meta=[];
  try{ const r=await fetch(RAW+'obras.json',{cache:'no-cache'}); if(r.ok) meta=await r.json(); }catch(e){}
  const metaOf=f=>meta.find(o=>o.file===f)||{};
  let files=null;
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.dir}?ref=${REPO.branch}`);
    if(r.ok){
      const arr=await r.json();
      files=arr.filter(f=>f.type==='file'&&/\.(mxl|musicxml|xml)$/i.test(f.name)).map(f=>({name:f.name,url:f.download_url}));
    }
  }catch(e){}
  // sem API (limite do GitHub, offline): usa o que o obras.json e a lista fixa conhecem
  if(!files||!files.length){
    const names=[...new Set([...meta.map(o=>o.file),...Object.keys(KNOWN)])];
    files=names.map(n=>({name:n,url:RAW+encodeURIComponent(n)}));
  }
  const order=f=>{const i=meta.findIndex(o=>o.file===f);return i<0?1e6:i;};
  files.sort((a,b)=>order(a.name)-order(b.name)||a.name.localeCompare(b.name));
  return files.map(f=>{const o=metaOf(f.name);return makeWork({id:f.name,file:f.name,url:f.url,title:o.title,composer:o.composer,year:o.year,meta:o});});
}

async function bufferToXml(buf){
  const u=new Uint8Array(buf);
  if(u[0]===0x50&&u[1]===0x4b){ // .mxl (zip)
    const zip=await JSZip.loadAsync(buf);
    let path=null;
    const c=zip.file('META-INF/container.xml');
    if(c){const m=(await c.async('string')).match(/full-path="([^"]+)"/);if(m)path=m[1];}
    if(!path)path=Object.keys(zip.files).find(f=>/\.(xml|musicxml)$/i.test(f)&&!/META-INF/i.test(f));
    return zip.file(path).async('string');
  }
  return new TextDecoder().decode(u);
}

function ensureLoaded(w){
  if(w.status==='ready'||w.status==='error')return Promise.resolve();
  if(w._p)return w._p;
  w.status='loading'; updateCard(w);
  w._p=(async()=>{
    const buf=w.fileObj? await w.fileObj.arrayBuffer() : await (await fetch(w.url)).arrayBuffer();
    const xml=await bufferToXml(buf);
    await new Promise(r=>setTimeout(r,0)); // deixa a tela respirar antes de parsear
    prepareWork(w, parseMusicXML(xml));
    w.status='ready'; updateCard(w);
  })().catch(e=>{console.error(e);w.status='error';w.err=e.message;updateCard(w);});
  return w._p;
}

function prepareWork(w,p){
  const k=KNOWN[w.file]||{};
  w.notes=p.notes; w.totalMs=p.totalMs;
  w.title=w.title||k.title||p.title||prettyName(w.file);
  w.composer=w.composer||k.composer||(p.composer||'').trim().split(/\s+/).pop()||'';
  const map={}; let pMin=127,pMax=0;
  for(const n of w.notes){
    if(!(n.part in map))map[n.part]=panFor(n.part,n.pan);
    if(n.midi<pMin)pMin=n.midi; if(n.midi>pMax)pMax=n.midi;
  }
  if(pMin>pMax){pMin=48;pMax=84;}
  const ins=Object.entries(map).map(([part,pan])=>({part,pan})).sort((a,b)=>a.pan-b.pan);
  const N=ins.length, xmap={};
  ins.forEach((it,i)=>{it.xNorm=N>1?(i/(N-1))*2-1:0; xmap[it.part]=it.xNorm;});
  for(const n of w.notes)n.xNorm=xmap[n.part];
  w.instruments=ins; w.pMin=pMin; w.pMax=pMax;
  const present=new Set(w.notes.map(n=>n.naipe));
  w.naipes=ORDEM.filter(n=>present.has(n));
  // metadados p/ o filtro futuro
  w.meta=Object.assign({},w.meta,{composer:w.composer,year:w.year,durMs:w.totalMs,parts:N,naipes:w.naipes,notes:w.notes.length});
  buildRing(w);
}

async function loadQueue(){
  const q=works.filter(w=>w.status==='idle'); let i=0;
  const worker=async()=>{while(i<q.length){await ensureLoaded(q[i++]);}};
  await Promise.all([worker(),worker()]);
}

// ── Cards ──
function addCard(w){
  const c=document.createElement('div'); c.className='card';
  c.innerHTML='<div class="ring-view"><span class="card-status"></span></div><div><div class="card-title"></div><div class="card-composer"></div><div class="card-info"></div></div>';
  w.card=c; w.ringEl=c.querySelector('.ring-view');
  // hover: a posição do mouse no quadrado inclina o anel em 3D (sai da vista de cima)
  const rv=w.ringEl;
  rv.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')w.hover=true;});
  rv.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    const r=rv.getBoundingClientRect();
    let nx=(e.clientX-r.left)/r.width*2-1, ny=(e.clientY-r.top)/r.height*2-1;
    const L=Math.hypot(nx,ny); if(L>1){nx/=L;ny/=L;}
    w.hover=true; w.tilt.tx=nx; w.tilt.ty=ny;
  });
  rv.addEventListener('pointerleave',()=>{w.hover=false;w.tilt.tx=0;w.tilt.ty=0;});
  c.addEventListener('click',()=>{location.hash=encodeURIComponent(w.id);});
  grid.appendChild(c); updateCard(w);
}
function updateCard(w){
  const c=w.card; if(!c)return;
  c.querySelector('.card-title').textContent=w.title||KNOWN[w.file]?.title||prettyName(w.file);
  c.querySelector('.card-composer').textContent=[w.composer,w.year].filter(Boolean).join(' · ');

  c.querySelector('.card-info').textContent= w.status==='ready' ? `${fmtTime(w.totalMs)} · ${w.instruments.length} partes · ${w.notes.length} notas` : '';
  if(w.status==='ready'||w.status==='error')refreshFilters();
}

const filt={comps:new Set(),y0:YMIN,y1:YMAX};
const fullRange=()=>filt.y0<=YMIN&&filt.y1>=YMAX;
const yearPct=y=>((y-YMIN)/(YMAX-YMIN))*100;
function matchComp(w){return !filt.comps.size||filt.comps.has(w.composer);}
function matchYear(w){return fullRange()||(w.year&&w.year>=filt.y0&&w.year<=filt.y1);}
const fComps=$('f-composers'), tlTrack=$('tl-track'), tlSel=$('tl-sel'), tlEras=$('tl-eras'), tlRange=$('tl-range'), fClear=$('f-clear');
const tlHandles=[...tlTrack.querySelectorAll('.tl-h')];
let _compKey='';

ERAS.forEach(e=>{
  const b=document.createElement('button'); b.className='tl-era'; b.textContent=e.label;
  b.title=`${e.label} · ${e.a}–${e.b}`;
  b.style.left=yearPct(e.a)+'%'; b.style.width=(yearPct(e.b)-yearPct(e.a))+'%';
  b.addEventListener('click',()=>{
    if(filt.y0===e.a&&filt.y1===e.b){filt.y0=YMIN;filt.y1=YMAX;} else {filt.y0=e.a;filt.y1=e.b;}
    applyFilter();
  });
  e.btn=b; tlEras.appendChild(b);
});

function refreshFilters(){
  // chips de compositor (refeitos só quando a lista muda)
  const counts={};
  works.forEach(w=>{if(w.composer)counts[w.composer]=(counts[w.composer]||0)+1;});
  const names=Object.keys(counts).sort((a,b)=>a.localeCompare(b));
  const key=names.map(n=>n+counts[n]).join('|');
  if(key!==_compKey){
    _compKey=key; fComps.innerHTML='';
    for(const n of [...filt.comps]) if(!counts[n]) filt.comps.delete(n);
    const all=document.createElement('button'); all.className='chip'; all.dataset.c=''; all.textContent='todos';
    all.addEventListener('click',()=>{filt.comps.clear();applyFilter();});
    fComps.appendChild(all);
    names.forEach(n=>{
      const b=document.createElement('button'); b.className='chip'; b.dataset.c=n;
      b.innerHTML=`${n}<span class="n">${counts[n]}</span>`;
      b.addEventListener('click',()=>{filt.comps.has(n)?filt.comps.delete(n):filt.comps.add(n);applyFilter();});
      fComps.appendChild(b);
    });
  }
  // pontinhos na linha do tempo: uma obra = um ponto no seu ano
  tlTrack.querySelectorAll('.tl-dot').forEach(d=>d.remove());
  works.forEach(w=>{
    if(!w.year)return;
    const d=document.createElement('div'); d.className='tl-dot'; d.style.left=yearPct(w.year)+'%';
    w.dot=d; tlTrack.appendChild(d);
  });
  applyFilter();
}

function applyFilter(){
  let shown=0;
  works.forEach(w=>{
    const ok=matchComp(w)&&matchYear(w);
    if(w.card)w.card.style.display=ok?'':'none';
    if(ok)shown++;
    if(w.dot&&w.year)w.dot.classList.toggle('off',!(matchComp(w)&&w.year>=filt.y0&&w.year<=filt.y1));
  });
  fComps.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.c?filt.comps.has(b.dataset.c):!filt.comps.size));
  ERAS.forEach(e=>e.btn.classList.toggle('on',filt.y0===e.a&&filt.y1===e.b));
  tlSel.style.left=yearPct(filt.y0)+'%'; tlSel.style.width=(yearPct(filt.y1)-yearPct(filt.y0))+'%';
  tlHandles[0].style.left=yearPct(filt.y0)+'%'; tlHandles[1].style.left=yearPct(filt.y1)+'%';
  tlRange.textContent=fullRange()?'todas as épocas':`${filt.y0} — ${filt.y1}`;
  const active=filt.comps.size||!fullRange();
  fClear.style.visibility=active?'visible':'hidden';
  const total=works.length;
  $('home-count').textContent=active?`${shown} de ${total} obras`:total+(total===1?' obra':' obras');
  let empty=grid.querySelector('.grid-empty');
  if(!shown&&total){
    if(!empty){empty=document.createElement('div');empty.className='grid-empty';empty.textContent='nenhuma obra nesse filtro';grid.appendChild(empty);}
  } else if(empty) empty.remove();
}
fClear.addEventListener('click',()=>{filt.comps.clear();filt.y0=YMIN;filt.y1=YMAX;applyFilter();});

let tlDrag=-1;
function tlYear(e){const r=tlTrack.getBoundingClientRect();return Math.round(YMIN+Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(YMAX-YMIN));}
function tlSet(h,y){
  if(h===0)filt.y0=Math.min(y,filt.y1-1); else filt.y1=Math.max(y,filt.y0+1);
  applyFilter();
}

const scrub=$('scrub'),scrubFill=$('scrub-fill'),scrubKnob=$('scrub-knob'),scrubTime=$('scrub-time'),btnPlay=$('btn-play');

function setPlayhead(ms,seek){

  playheadMs=Math.max(0,Math.min(T,ms));
  if(seek&&isPlaying&&audioCtx){ newBus(); resetSched(); }

  scrubFill.style.width=p+'%'; scrubKnob.style.left=p+'%';
  scrubTime.textContent=fmtTime(playheadMs)+' / '+fmtTime(T);
}
function sm(e){if(!cur)return;const r=scrub.getBoundingClientRect();setPlayhead(((e.clientX-r.left)/r.width)*cur.totalMs,true);}

function startPlayback(){

  if(playheadMs>=cur.totalMs)setPlayhead(0,false);
  isPlaying=true; newBus(); resetSched(); btnPlay.textContent='⏸';
}

// ══════════════════════════════════════════════════════════════
//  ÁUDIO — síntese por naipe + articulações e ornamentos audíveis
// ══════════════════════════════════════════════════════════════
let audioCtx=null, master=null, bus=null, noiseBuf=null, schedPtr=0, voices=0;
const LOOKAHEAD_MS=250, MAX_VOICES=110;
function initAudio(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=audioCtx.createDynamicsCompressor();
  comp.threshold.value=-18; comp.ratio.value=6; comp.attack.value=0.005; comp.release.value=0.2;
  master=audioCtx.createGain(); master.gain.value=0.9;
  master.connect(comp); comp.connect(audioCtx.destination);
  noiseBuf=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
// cada play/seek ganha um "bus" novo; o antigo é silenciado (corta o que já estava agendado)
function newBus(){ killBus(); bus=audioCtx.createGain(); bus.connect(master); }
function killBus(){
  if(!bus)return; const b=bus; bus=null; const t=audioCtx.currentTime;
  b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value,t); b.gain.linearRampToValueAtTime(0,t+0.04);
  setTimeout(()=>b.disconnect(),200);
}
function lowerBound(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].startMs<t)lo=m+1;else hi=m;}return lo;}
function resetSched(){ schedPtr=cur?lowerBound(cur.notes,playheadMs):0; }
function scheduleAudio(){
  if(!audioCtx||!bus||!cur)return;
  const notes=cur.notes, horizon=playheadMs+LOOKAHEAD_MS, now=audioCtx.currentTime;
  while(schedPtr<notes.length&&notes[schedPtr].startMs<horizon){
    const n=notes[schedPtr++];
    if(n.startMs<playheadMs-40)continue;
    playNote(n, now+Math.max(0,(n.startMs-playheadMs)/1000));
  }
}
const midiToFreq=m=>440*Math.pow(2,(m-69)/12);
// vizinho diatônico aproximado (escala de dó): E→F e B→C são meio-tom
function upperNb(m){const pc=((m%12)+12)%12;return m+((pc===4||pc===11)?1:2);}
function lowerNb(m){const pc=((m%12)+12)%12;return m-((pc===0||pc===5)?1:2);}

const TIMBRE={
  cordas:    {wave:'sawtooth',cut:2400,atk:0.05, rel:0.15},
  madeiras:  {wave:'triangle',cut:3200,atk:0.035,rel:0.08},
  metais:    {wave:'sawtooth',cut:1500,atk:0.045,rel:0.10},
  'percussão':{wave:'sine',   cut:2000,atk:0.003,rel:0.20,pluck:0.45},
  piano:     {wave:'triangle',cut:4000,atk:0.004,rel:0.25,pluck:0.9},
  harpa:     {wave:'triangle',cut:3600,atk:0.003,rel:0.40,pluck:1.2},
  outros:    {wave:'triangle',cut:3000,atk:0.02, rel:0.10},
};

function playNote(n,when){
  if(voices>MAX_VOICES)return;
  const op=noteOpacity(n); if(op<=0)return; // o mixer também é volume
  const ctx=audioCtx, T=TIMBRE[n.naipe]||TIMBRE.outros;
  const A=new Set([n.art1,n.art2].filter(Boolean));
  let dur=Math.max(0.05,Math.min(8,n.durMs/1000));
  let vol=0.055*(0.25+0.75*(n.satVal??0.7))*op;
  let atk=T.atk, rel=T.rel, peak=1, sustain=1, cut=T.cut, pluck=T.pluck||0, wave=T.wave;

  // ── articulações ──
  if(A.has(1)) dur=Math.max(0.05,dur*0.25);            // staccatissimo: bem curtinho
  else if(A.has(2)) dur=Math.max(0.06,dur*0.5);        // staccato: metade
  if(A.has(7)){ dur*=0.85; atk=Math.max(atk,0.06); }  // portato: separado e macio
  if(A.has(3)){ rel*=1.8; pluck=0; }                   // tenuto: segura o valor inteiro
  if(A.has(4)) peak=Math.max(peak,1.7);                // acento: ataque mais forte
  if(A.has(5)){ peak=Math.max(peak,2.1); dur*=0.8; }   // marcato: forte e destacado
  if(n.sfz){ peak=2.4; sustain=0.45; }                 // sf/sfz/fp: explode e recua
  // ── técnicas ──
  if(n.tech==='pizz'){ wave='triangle'; atk=0.003; pluck=0.25; dur=Math.min(dur,0.5); cut=1600; }
  if(n.mute){ cut*=0.35; vol*=0.7; }                   // surdina: abafado
  if(n.harmonic){ wave='sine'; vol*=0.7; atk=Math.max(atk,0.06); } // harmônico: puro, etéreo
  if(n.pedal) rel+=1.2;                                // pedal: deixa ressoar
  if(n.hasFermata) dur*=1.5;                           // fermata: suspende
  // ── tempo ──
  if(n.isGrace){ dur=0.07; when=Math.max(ctx.currentTime,when-0.07); } // apojatura: antes do tempo
  if(n.arpIdx) when+=n.arpIdx*0.045;                   // arpejo: grave → agudo

  if(n.unpitched) return playNoise(when,Math.min(dur,0.25),vol*1.6);

  const end=when+dur;
  const osc=ctx.createOscillator(); osc.type=wave;
  const f0=midiToFreq(n.midi), F=osc.frequency;
  F.setValueAtTime(f0,when);
  // ── ornamentos de altura ──
  if(n.hasTrill){ // trinado: alterna nota e vizinha superior
    const fu=midiToFreq(upperNb(n.midi)), step=1/13; let t=when+step, k=1;
    while(t<end-step*0.5&&k<400){F.setValueAtTime(k%2?fu:f0,t);t+=step;k++;}
    F.setValueAtTime(f0,t);
  } else if(n.hasTurn){ // grupeto: principal → superior → principal → inferior → principal
    const st=Math.min(0.07,dur/5), seq=[upperNb(n.midi),n.midi,lowerNb(n.midi),n.midi];
    seq.forEach((m,i)=>F.setValueAtTime(midiToFreq(m),when+st*(i+1)));
  } else if(n.hasMordent){ // mordente: principal → vizinha → principal (rápido)
    const st=Math.min(0.06,dur/4), o=n.mordentDir>0?upperNb(n.midi):lowerNb(n.midi);
    F.setValueAtTime(midiToFreq(o),when+st); F.setValueAtTime(f0,when+2*st);
  }
  if(n.gliss&&n.glissTarget!=null){ F.setValueAtTime(f0,when+dur*0.1); F.exponentialRampToValueAtTime(midiToFreq(n.glissTarget),end); }

  const flt=ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=cut; flt.Q.value=0.6;
  const env=ctx.createGain(), mod=ctx.createGain();
  const g=env.gain;
  g.setValueAtTime(0,when);
  g.linearRampToValueAtTime(vol*peak,when+atk);
  if(pluck>0) g.setTargetAtTime(vol*0.001,when+atk,pluck*0.35);
  else if(peak>1||sustain<1) g.setTargetAtTime(vol*sustain,when+atk,0.07);
  g.setTargetAtTime(0,end,rel/3);
  // crescendo/diminuendo dentro da nota
  mod.gain.setValueAtTime(1,when);
  if(n.wedge==='cresc') mod.gain.linearRampToValueAtTime(1.3,end);
  else if(n.wedge==='dim') mod.gain.linearRampToValueAtTime(0.65,end);

  osc.connect(flt); flt.connect(env); env.connect(mod);
  let out=mod, lfo=null;
  if(n.hasTremolo){ // tremolo: pulsação de volume (mais traços = mais rápido)
    const rate=[0,6,9,13,16][Math.max(1,Math.min(4,n.tremoloMarks||3))];
    const tg=ctx.createGain(); tg.gain.value=0.5;
    lfo=ctx.createOscillator(); lfo.type='square'; lfo.frequency.value=rate;
    const depth=ctx.createGain(); depth.gain.value=0.5;
    lfo.connect(depth); depth.connect(tg.gain);
    mod.connect(tg); out=tg;
    lfo.start(when); lfo.stop(end+rel*2+0.1);
  }
  out.connect(bus);
  osc.start(when); osc.stop(end+rel*2+0.1);
  voices++; osc.onended=()=>{voices--;try{out.disconnect();}catch(e){}};
}
function playNoise(when,dur,vol){
  const ctx=audioCtx, src=ctx.createBufferSource(); src.buffer=noiseBuf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.8;
  const g=ctx.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  src.connect(bp); bp.connect(g); g.connect(bus);
  src.start(when); src.stop(when+dur+0.02);
  voices++; src.onended=()=>{voices--;try{g.disconnect();}catch(e){}};
}

// ══════════════════════════════════════════════════════════════
//  MIXER
// ══════════════════════════════════════════════════════════════
function buildFilters(){
  const mix=$('mixer'); mix.innerHTML='';
  mix.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;width:100%;align-content:center;justify-items:center;';
  ORDEM.forEach(k=>naipeOp[k]=1); melOn=true; harmOn=true;
  const mkItem=(label,init,onCh)=>{
    const wrap=document.createElement('div');wrap.style.cssText='display:flex;align-items:center;gap:8px;background:#e6e6e6;border-radius:20px;padding:7px 18px;';
    const pill=document.createElement('div');pill.textContent=label;
    pill.style.cssText='color:#555;font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;min-width:64px;text-align:left;';
    const tr=document.createElement('div');tr.style.cssText='width:80px;height:9px;background:#ccc;position:relative;cursor:pointer;border-radius:5px;touch-action:none;';
    const fill=document.createElement('div');fill.style.cssText='position:absolute;top:0;left:0;height:100%;background:#333;border-radius:5px;';fill.style.width=(init*100)+'%';
    const kn=document.createElement('div');kn.style.cssText='position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#333;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 2px #e6e6e6;';kn.style.left=(init*100)+'%';
    tr.appendChild(fill);tr.appendChild(kn);wrap.appendChild(pill);wrap.appendChild(tr);
    let dg=false;
    const upd=e=>{const r=tr.getBoundingClientRect();const v=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));fill.style.width=(v*100)+'%';kn.style.left=(v*100)+'%';onCh(v);};
    tr.addEventListener('pointerdown',e=>{dg=true;tr.setPointerCapture(e.pointerId);upd(e);e.preventDefault();});
    tr.addEventListener('pointermove',e=>{if(dg)upd(e);});
    tr.addEventListener('pointerup',()=>dg=false);
    return wrap;
  };
  const mkToggle=(label,initOn,onCh)=>{
    const b=document.createElement('button'); b.className='toggle'+(initOn?' on':'');
    b.innerHTML='<span class="led"></span>'+label; let on=initOn;
    b.addEventListener('click',()=>{on=!on;b.classList.toggle('on',on);onCh(on);});
    return b;
  };
  cur.naipes.forEach(np=>mix.appendChild(mkItem(np,1,v=>naipeOp[np]=v)));
  mix.appendChild(mkToggle('melodia',true,on=>melOn=on));
  mix.appendChild(mkToggle('harmonia',true,on=>harmOn=on));
}

// ══════════════════════════════════════════════════════════════
//  PAINÉIS 2D (Canvas 2D puro)
// ══════════════════════════════════════════════════════════════
function makeCanvas2D(id){
  const el=$(id), c=document.createElement('canvas'); el.appendChild(c);
  const o={el,c,ctx:c.getContext('2d'),w:0,h:0};
  o.resize=()=>{const dpr=Math.min(2,window.devicePixelRatio||1);o.w=el.clientWidth;o.h=el.clientHeight;c.width=Math.max(1,o.w*dpr);c.height=Math.max(1,o.h*dpr);c.style.width=o.w+'px';c.style.height=o.h+'px';o.ctx.setTransform(dpr,0,0,dpr,0,0);};
  return o;
}
const slice=makeCanvas2D('p-slice'), notesP=makeCanvas2D('p-notes');

function drawNote2D(ctx,cx,cy,sz,n,alpha){
  if(n.wedge==='cresc'&&n.wedgePos!=null)sz*=1+n.wedgePos*0.4;
  else if(n.wedge==='dim'&&n.wedgePos!=null)sz*=1-n.wedgePos*0.6;
  if(n.isGrace)sz*=0.5;
  const [r,g,b]=n.color;
  for(const part of shapeOf(n).parts){
    ctx.fillStyle=`rgba(${r|0},${g|0},${b|0},${alpha*(part.mul??1)})`;
    ctx.beginPath();
    part.pts.forEach(([px,py],i)=>{const x=cx+px*sz,y=cy-py*sz;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.closePath(); ctx.fill();
  }
}

function drawSlice(){
  const {ctx,w:cw,h:ch}=slice; ctx.clearRect(0,0,cw,ch);
  const padT=38,padB=6,padL=30,padR=16, innerH=ch-padT-padB, innerW=cw-padL-padR;
  const pMin=cur.pMin,pMax=cur.pMax,pRange=Math.max(1,pMax-pMin);
  const yFor=m=>padT+innerH-((m-pMin)/pRange)*innerH;
  ctx.font='8px "Geist Mono", monospace'; ctx.textBaseline='middle';
  for(let oct=Math.floor(pMin/12)-1;oct<=Math.floor(pMax/12)-1;oct++){
    const m=(oct+1)*12; if(m<pMin||m>pMax)continue;
    const yy=yFor(m);
    ctx.strokeStyle='rgb(215,215,215)';ctx.lineWidth=0.6;ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(cw-padR,yy);ctx.stroke();
    ctx.fillStyle='rgb(140,140,140)';ctx.textAlign='left';ctx.fillText('C'+oct,4,yy);
  }
  const N=cur.instruments.length;
  ctx.fillStyle='rgb(150,150,150)'; ctx.textAlign='right';
  for(const ins of cur.instruments){
    const np=detectNaipe(ins.part); if((naipeOp[np]??1)<=0)continue;
    const xx=padL+((ins.xNorm+1)/2)*innerW;
    ctx.save();ctx.translate(xx,padT-6);ctx.rotate(-Math.PI/4);ctx.fillText(ins.part.slice(0,16),0,0);ctx.restore();
  }
  const cellW=N>1?innerW/N:innerW*0.5, sz=Math.min(cellW*0.8,14);
  for(const n of activeNow) drawNote2D(ctx,padL+((n.xNorm+1)/2)*innerW,yFor(n.midi),sz,n,noteOpacity(n));
}

function drawNotes(){
  const {ctx,w:cw,h:ch}=notesP; ctx.clearRect(0,0,cw,ch);
  if(!activeNow.length){ctx.fillStyle='rgb(180,180,180)';ctx.font='9px "Geist Mono", monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('—',cw/2,ch/2);return;}
  const act=activeNow.slice().sort((a,b)=>a.midi-b.midi), N=act.length;
  const cols=Math.max(1,Math.ceil(Math.sqrt(N*cw/ch))), rows=Math.ceil(N/cols);
  const pad=8, cellW=(cw-pad*2)/cols, cellH=(ch-pad*2)/rows, sz=Math.min(cellW,cellH,30);
  ctx.font='6px "Geist Mono", monospace'; ctx.textAlign='center'; ctx.textBaseline='top';
  act.forEach((n,i)=>{
    const cx=pad+(i%cols)*cellW+cellW/2, cy=pad+Math.floor(i/cols)*cellH+cellH/2;
    drawNote2D(ctx,cx,cy,sz*0.62,n,noteOpacity(n));
    ctx.fillStyle='rgb(150,150,150)'; ctx.fillText(noteName(n.midi),cx,cy+sz*0.42);
  });
}

const colorBar=$('color-bar'); let _cbT=0;
function drawColorBar(now){
  if(now-_cbT<80)return; _cbT=now;
  const act=activeNow.slice().sort((a,b)=>a.midi-b.midi);
  colorBar.innerHTML=act.map(n=>{const[r,g,b]=n.color;return `<div style="flex:1;background:rgba(${r|0},${g|0},${b|0},${noteOpacity(n).toFixed(2)});"></div>`;}).join('');
}

// ══════════════════════════════════════════════════════════════
//  CÂMERA DO PLAYER (orbital · seguir · centro/dentro), com suavização
// ══════════════════════════════════════════════════════════════
const camP=new THREE.PerspectiveCamera(35,1,0.1,50000), camG=new THREE.PerspectiveCamera(30,1,0.1,50000);
const VIEWS={persp:{rx:0.5,ry:0},top:{rx:Math.PI/2,ry:0},side:{rx:0,ry:Math.PI/2},right:{rx:0,ry:-Math.PI/2},front:{rx:0,ry:0}};
const pc={rx:0.5,ra:0,tRx:0.5,tRa:0,zoom:1,followZoom:2.4,insideFov:68,tilt:0,camMode:'persp',follow:false,inside:false};
const CS={pos:new THREE.Vector3(),tgt:new THREE.Vector3(),up:new THREE.Vector3(0,1,0),fov:35,init:false};
const D={pos:new THREE.Vector3(),tgt:new THREE.Vector3(),up:new THREE.Vector3()};
const wrapPI=a=>Math.atan2(Math.sin(a),Math.cos(a));

function setView(m){
  if(m==='follow'){pc.follow=!pc.follow;}
  else if(m==='persp'){pc.inside=!pc.inside;pc.camMode='persp';if(!pc.inside)pc.follow=false;} // CENTRO = visão de dentro do anel
  else{pc.camMode=m;pc.follow=false;pc.inside=false;pc.tRx=VIEWS[m].rx;pc.tRa=pc.ra+wrapPI(VIEWS[m].ry-pc.ra);}
  updateCamBtns();
}
function updateCamBtns(){
  document.querySelectorAll('.cam-b, .toggle[data-cam]').forEach(b=>{
    const c=b.dataset.cam;
    if(c==='follow')b.classList.toggle('on',pc.follow);
    else if(c==='persp')b.classList.toggle('on',pc.inside);
    else b.classList.toggle('on',c===pc.camMode&&!pc.inside&&!pc.follow);
  });
}
document.querySelectorAll('.cam-b, .toggle[data-cam]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.cam)));
$('btn-onlyactive').addEventListener('click',e=>{onlyActive=!onlyActive;e.currentTarget.classList.toggle('on',onlyActive);});
updateCamBtns();

function playerCamera(dt,aspect){
  const pa=(playheadMs/(cur.totalMs||1))*Math.PI*2-Math.PI/2;
  let fov=35;
  if(pc.inside){
    fov=pc.insideFov;
    const v=(pc.follow||onlyActive)?pa:(pc.ra-Math.PI/2), eR=R0*0.25;
    D.pos.set(-Math.sin(v)*eR,R0*0.15,-Math.cos(v)*eR);
    D.tgt.set(Math.sin(v)*R0,-pc.tilt*R0,Math.cos(v)*R0);
    D.up.set(0,1,0);
  } else if(pc.follow){
    const d=fitDist(R0*3.2/pc.followZoom,aspect,fov);
    D.tgt.set(Math.sin(pa)*R0,0,Math.cos(pa)*R0);
    D.pos.set(Math.cos(pa),0,-Math.sin(pa)).multiplyScalar(Math.cos(0.35)*d).add(D.tgt); D.pos.y+=Math.sin(0.35)*d;
    D.up.set(0,1,0);
  } else {
    const k=1-Math.exp(-dt*7); pc.rx+=(pc.tRx-pc.rx)*k; pc.ra+=(pc.tRa-pc.ra)*k;
    orbitPose(pc.rx,pc.ra,fitDist(R0*3.2/pc.zoom,aspect,fov),D.pos,D.up);
    D.tgt.set(0,0,0);
  }
  if(!CS.init){CS.pos.copy(D.pos);CS.tgt.copy(D.tgt);CS.up.copy(D.up);CS.fov=fov;CS.init=true;}
  else{const k=1-Math.exp(-dt*9);CS.pos.lerp(D.pos,k);CS.tgt.lerp(D.tgt,k);CS.up.lerp(D.up,k).normalize();CS.fov+=(fov-CS.fov)*k;}
  camP.position.copy(CS.pos); camP.up.copy(CS.up); camP.lookAt(CS.tgt);
  camP.fov=CS.fov; camP.aspect=aspect; camP.updateProjectionMatrix();
}

// interação com o anel
const pRing=$('p-ring'); let drag=false,lmx=0,lmy=0;
pRing.addEventListener('pointerdown',e=>{drag=true;lmx=e.clientX;lmy=e.clientY;pRing.setPointerCapture(e.pointerId);});
pRing.addEventListener('pointerup',()=>drag=false);
pRing.addEventListener('pointermove',e=>{
  if(!drag)return; const dx=e.clientX-lmx, dy=e.clientY-lmy; lmx=e.clientX; lmy=e.clientY;
  if(pc.inside){ pc.ra+=dx*0.01; pc.tRa=pc.ra; pc.tilt=Math.max(-0.8,Math.min(0.8,pc.tilt+dy*0.006)); }
  else{
    if(pc.follow){pc.follow=false;updateCamBtns();}
    pc.tRa+=dx*0.01; pc.tRx=Math.max(-Math.PI/2,Math.min(Math.PI/2,pc.tRx+dy*0.008));
    pc.ra=pc.tRa; pc.rx=pc.tRx;
  }
});
pRing.addEventListener('wheel',e=>{
  e.preventDefault(); const f=Math.exp(-e.deltaY*0.002);
  if(pc.inside)pc.insideFov=Math.max(30,Math.min(100,pc.insideFov/f));
  else if(pc.follow)pc.followZoom=Math.max(0.8,Math.min(12,pc.followZoom*f));
  else pc.zoom=Math.max(0.2,Math.min(14,pc.zoom*f));
},{passive:false});

// ══════════════════════════════════════════════════════════════
//  RENDER — um canvas, vários viewports (grid) ou um (player)
// ══════════════════════════════════════════════════════════════
function setRect(r){
  const H=window.innerHeight, y=H-r.bottom;
  renderer.setViewport(r.left,y,r.width,r.height);
  renderer.setScissor(r.left,y,r.width,r.height);
}
function setUniforms(w,t,only,mel,harm,naipes){
  const u=w.mat.uniforms; u.uTime.value=t; u.uOnly.value=only?1:0; u.uMel.value=mel?1:0; u.uHarm.value=harm?1:0;
  ORDEM.forEach((k,i)=>u.uNaipe.value[i]=naipes?(naipes[k]??1):1);
}
function render(dt){
  renderer.setScissorTest(false); renderer.clear(); renderer.setScissorTest(true);
  if(view==='home'){
    const H=window.innerHeight, k=1-Math.exp(-dt*7);
    for(const w of works){
      if(w.status!=='ready'||!w.ringEl)continue;
      const r=w.ringEl.getBoundingClientRect();
      if(r.bottom<0||r.top>H||r.width<2)continue;
      // capa: vista de cima girando; no hover o giro pausa e o mouse inclina o anel
      const t=w.tilt;
      t.x+=(t.tx-t.x)*k; t.y+=(t.ty-t.y)*k;
      if(!w.hover)w.spin+=dt*0.12;
      _qSpin.setFromAxisAngle(_yAx,w.spin);
      _qTilt.setFromEuler(_eT.set(-t.y*MAX_TILT,0,t.x*MAX_TILT,'XYZ')); // o lado sob o cursor sobe em direção à câmera
      w.scene.quaternion.multiplyQuaternions(_qTilt,_qSpin);
      setUniforms(w,-1,false,true,true,null); w.line.visible=false;
      const aspect=r.width/r.height;
      camG.position.set(0,fitSphere(aspect,camG.fov),0); camG.up.set(0,0,-1); camG.lookAt(0,0,0);
      camG.aspect=aspect; camG.updateProjectionMatrix();
      setRect(r); renderer.render(w.scene,camG);
    }
  } else if(cur){
    cur.scene.quaternion.identity();
    const r=pRing.getBoundingClientRect(); if(r.width<2)return;
    playerCamera(dt,r.width/r.height);
    setUniforms(cur,playheadMs,onlyActive,melOn,harmOn,naipeOp);
    const pa=(playheadMs/(cur.totalMs||1))*Math.PI*2-Math.PI/2, p=cur.line.geometry.attributes.position;
    p.setXYZ(0,Math.sin(pa)*(R0-RW),0,Math.cos(pa)*(R0-RW)); p.setXYZ(1,Math.sin(pa)*(R0+RW),0,Math.cos(pa)*(R0+RW)); p.needsUpdate=true;
    cur.line.visible=!onlyActive;
    setRect(r); renderer.render(cur.scene,camP);
  }
}

let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-lastT)/1000); lastT=now;
  if(view==='player'&&cur){
    if(isPlaying){
      setPlayhead(playheadMs+dt*1000,false); scheduleAudio();
      if(playheadMs>=cur.totalMs){stopPlayback();showEndScreen();}
    }
    computeActive(); drawSlice(); drawNotes(); drawColorBar(now);
  }
  render(dt);
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);if(view==='player'){slice.resize();notesP.resize();}});

// ══════════════════════════════════════════════════════════════
//  INÍCIO
// ══════════════════════════════════════════════════════════════
(async()=>{
  requestAnimationFrame(frame);
  $('home-count').textContent='procurando obras…';
  works=await discoverWorks();
  works.forEach(addCard); updateCount();
  route();
  loadQueue();
})();
</script>
